<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIDA Parts & Cash Out per Tahun</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#121b2d;--card2:#0e1626;--accent:#f97316;--blue:#38bdf8;--text:#f1f5f9;--muted:#8b9bb4;--border:#223049;--ok:#22c55e;--warn:#eab308;--bad:#ef4444;--fd:'Space Grotesk','IBM Plex Sans',sans-serif;--fb:'IBM Plex Sans','Segoe UI',sans-serif}
*{box-sizing:border-box}
body{margin:0;padding:0 16px 40px;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;display:flex;justify-content:center}
.wrap{max-width:1200px;width:100%}
.top{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.top img.m{height:30px}.top .g{background:#fff;border-radius:6px;padding:4px 10px}.top .g img{height:18px;display:block}
.top .sp{flex:1}.top .tt{font-family:var(--fd);font-weight:600;font-size:1.05rem}
h2{font-family:var(--fd);font-size:1rem;margin:0 0 12px;color:var(--blue);font-weight:600}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
label{display:block;font-size:.75rem;color:var(--muted);margin-bottom:4px}
input,select{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px;font:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent)}
.btn{background:var(--accent);color:#111;border:0;border-radius:6px;padding:10px 16px;font:600 .9rem var(--fb);cursor:pointer}
.btn.s{background:var(--card2);color:var(--text);border:1px solid var(--border)}.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.drop{border:2px dashed var(--border);border-radius:10px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.on{border-color:var(--accent);color:var(--text)}
.msg{border-radius:8px;padding:10px 12px;margin-top:10px;font-size:.85rem}
.msg.e{background:rgba(239,68,68,.12);border:1px solid var(--bad)}.msg.w{background:rgba(234,179,8,.1);border:1px solid var(--warn)}.msg.o{background:rgba(34,197,94,.1);border:1px solid var(--ok)}
.msg ul{margin:6px 0 0 18px;padding:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kpi{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:12px}
.kpi b{display:block;font:600 1.25rem var(--fd);margin-top:4px}.kpi span{font-size:.75rem;color:var(--muted)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.82rem}
th,td{padding:6px 8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{background:#1f4e78;color:#fff;text-align:center;position:sticky;top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.sec td{background:#16253d;font-weight:600;color:var(--blue)}
tr.sub td{background:#16311f;font-weight:600}
tr.tot td{background:#1d3b2a;font-weight:700;border-top:2px solid var(--ok)}
tr.as td.a{background:rgba(234,179,8,.12)}
.mut{color:var(--muted);font-size:.78rem}
.hide{display:none}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:720px){.charts{grid-template-columns:minmax(0,1fr)}}
.charts figure{margin:0}.charts figure.wide{grid-column:1/-1}
.charts h3{font:600 .85rem var(--fd);margin:0 0 6px;color:var(--muted)}
.charts svg{width:100%;height:auto;display:block}
.printnote{display:none;font-size:.8rem;color:var(--muted)}
@page{size:A4 landscape;margin:10mm}
@media print{:root{--text:#000;--muted:#555;--border:#ccc}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}.noprint{display:none!important}th{background:#1f4e78!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.charts{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px 14px!important}.charts figure{break-inside:avoid;page-break-inside:avoid}.charts figure.wide{grid-column:1/-1}.charts svg{max-height:62mm}.card.cc{break-inside:auto}.detail{display:none!important}.printnote{display:block!important}#sum.tw{overflow:visible}#sum table{font-size:.52rem;table-layout:auto}#sum th,#sum td{padding:3px 1px}#sum th:first-child,#sum td:first-child{white-space:normal;min-width:52px}.card{break-inside:avoid}td,.kpi b{color:#000}tr.sec td,tr.sub td,tr.tot td{background:#eef!important;color:#000}.kpi{background:#fff}}
</style>
</head>

/* GIDA Parts & Cash Out — mesin hitung (tanpa DOM, bisa diuji di Node) */
(function (root) {
'use strict';

/* ---------- Data model ---------- */
const SPECS = {
  'GD9-M':  { pv: 1785, bat: 10240, ch: 3600, lamp: 800,  price: 260000000 },
  'GDQ9-M': { pv: 3570, bat: 32153, ch: 3600, lamp: 1200, price: 404900000 },
  'GD7-H':  { pv: 1785, bat: 16076, ch: 3600, lamp: 600,  price: 245200000 },
  'GD9-H':  { pv: 2130, bat: 16076, ch: 3600, lamp: 800,  price: 312000000 },
  'GD12-H': { pv: 2975, bat: 32153, ch: 3600, lamp: 1200, price: 427200000 }
};
const WEATHER = [
  { id: 'gelap', psh: 0 },
  { id: 'mendung', psh: 1.5 },
  { id: 'berawan', psh: 3.0 },
  { id: 'cerah', psh: 4.5 }
];
const DEG_TABLE = { 50: 0.012, 55: 0.014, 60: 0.016, 65: 0.018, 70: 0.021, 75: 0.025, 80: 0.028, 85: 0.032, 90: 0.037, 95: 0.041, 100: 0.045 };
const FUEL_LPH = 16 / 12;      // liter per jam genset menyala
const GEN_RATED_W = 5000;     // daya genset (W)
const INV_RATED_W = 3600;     // daya inverter (W)
const DT = 1 / 12;             // langkah 5 menit (jam)

function degPerYear(dod) {
  if (DEG_TABLE[dod] !== undefined) return DEG_TABLE[dod];
  const keys = Object.keys(DEG_TABLE).map(Number).sort((a, b) => a - b);
  let lo = keys[0], hi = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) if (dod >= keys[i] && dod <= keys[i + 1]) { lo = keys[i]; hi = keys[i + 1]; break; }
  if (lo === hi) return DEG_TABLE[lo];
  return DEG_TABLE[lo] + (dod - lo) / (hi - lo) * (DEG_TABLE[hi] - DEG_TABLE[lo]);
}
const r9 = v => Math.round(v * 1e9) / 1e9;
const r2 = v => Math.round(v * 100) / 100;

/* ---------- Mesin simulasi 5 menit ----------
   Sama dengan simulator operasional: PV bentuk lonceng, lampu dari baterai lewat inverter,
   genset -> charger -> baterai, balancing 100% periodik, precharge opsional.
   Tambahan: kapasitas baterai turun linier menurut degradasi (opsional). */
function runEngine(p) {
  const spec = SPECS[p.model];
  const bat0 = spec.bat, ch = spec.ch;
  const chEff = p.chEff / 100, pvEff = p.pvEff / 100, invEff = p.invEff / 100;
  const lampBat = p.lamp / invEff;
  const bypass = p.gPath === 'bypass';
  // bypass: genset langsung ke lampu; sisa daya genset ke charger (maks. kapasitas charger)
  const genSlope = bypass ? Math.max(0, Math.min(ch, GEN_RATED_W - p.lamp)) * chEff : (ch * chEff - lampBat);
  const N = p.nights, off = p.off;
  const sh_ = h => (((h - off) % 24) + 24) % 24;
  const sStart = sh_(p.sStart), sStop = sh_(p.sStop);
  const shiftHrs = ((sStop - sStart) + 24) % 24 || 24;
  const lastEnd = 24 * (N - 1) + sStart + shiftHrs;
  const crossing = lastEnd > 24 * N + 1e-9;
  const rows = crossing ? N + 1 : N;
  const spd = Math.round(24 / DT);
  const steps = spd * rows;
  let sr = sh_(p.sunrise), ss = sh_(p.sunset);
  if (ss <= sr) ss = 24;
  const span = Math.max(0.1, ss - sr);
  const dayGain = spec.pv * p.psh * pvEff;
  const pvW = T => {
    const d = Math.floor(T / 24);
    if (d >= rows) return 0;
    const h = T - 24 * d;
    if (h < sr || h >= ss) return 0;
    return dayGain * (Math.PI / 2) / span * Math.sin(Math.PI * (h - sr) / span);
  };
  const dpy = p.degr ? p.degPerYear : 0;
  const capRow = new Float64Array(rows);
  for (let d = 0; d < rows; d++) capRow[d] = bat0 * Math.max(0.3, 1 - dpy * (d * shiftHrs) / p.hoursPerYear);

  const shifts = [];
  for (let k = 0; k < N; k++) {
    const cap = capRow[k];
    const trig = cap * (100 - p.dod) / 100;
    const st = 24 * k + sStart, en = st + shiftHrs;
    const preH_ = sh_(p.preHour);
    let pre = preH_ < sStart ? 24 * k + preH_ : 24 * (k - 1) + preH_;
    const bal = p.bal > 0 && ((k + 1) % p.bal === 0);
    if (!p.preOn && !bal) pre = Infinity;
    if (bal) pre = Math.min(pre, Math.max(24 * k, st - 12));
    const target = bal ? cap : Math.min(cap, trig + lampBat * shiftHrs);
    const stop = p.gMode === 'cont' ? Infinity : (p.gMode === 'full' ? cap : Math.max(trig + 1, Math.min(cap, cap * p.gPct / 100)));
    shifts.push({ k, st, en, pre: Math.max(0, pre), target, bal, cap, trig, stop, preH: 0, genH: 0, starts: 0, latched: false });
  }
  let soc = bat0 * p.soc0 / 100;
  let lampGapWh = 0, socMinPct = 100, pvAvail = 0, pvWaste = 0;
  const projPV = (T0, s0, Tend, cap) => { let s = s0; for (let T = T0; T < Tend; T += DT) s = Math.min(cap, s + pvW(T) * DT); return s; };

  for (let i = 0; i < steps; i++) {
    const T = i * DT, d = Math.floor(T / 24);
    const cap = capRow[Math.min(d, rows - 1)];
    if (soc > cap) soc = cap;
    let sh = null;
    for (let k = Math.max(0, d - 1); k <= Math.min(N - 1, d + 1); k++) { const x = shifts[k]; if (T >= x.st - 1e-9 && T < x.en - 1e-9) { sh = x; break; } }
    const pv = pvW(T);
    const cnt = T < lastEnd - 1e-9;
    if (cnt) pvAvail += pv * DT;
    if (sh) {
      if (!sh.latched && soc <= sh.trig + 1e-6) { sh.latched = true; sh.starts++; }
      // Genset berhenti/mulai TEPAT di titik SOC-nya di dalam langkah 5 menit (bukan dibulatkan ke batas langkah)
      if (sh.latched) {
        const r = genSlope + pv;                       // daya bersih ke baterai saat genset menyala (W)
        const nx = soc + r * DT;
        if (r > 0 && nx >= sh.stop - 1e-6) {
          const f = Math.max(0, Math.min(1, (sh.stop - soc) / (r * DT)));
          sh.genH += f * DT;
          soc = sh.stop + (pv - lampBat) * (1 - f) * DT;   // sisa langkah: genset mati, lampu dari baterai
          sh.latched = false;
        } else { sh.genH += DT; soc = nx; }
      } else {
        const dr = pv - lampBat, nx = soc + dr * DT;
        const f0 = dr < 0 ? (soc - sh.trig) / (-dr * DT) : 1;   // bagian langkah sebelum SOC menyentuh pemicu
        const onT = (1 - f0) * DT;
        if (dr < 0 && nx < sh.trig - 1e-6 && onT > 1e-4) {
          sh.latched = true; sh.starts++; sh.genH += onT;
          soc = sh.trig + (genSlope + pv) * onT;
        } else soc = nx;
      }
      if (soc > sh.cap) { if (cnt) pvWaste += Math.min(soc - sh.cap, pv * DT); soc = sh.cap; }
      if (soc < 0) { lampGapWh += -soc; soc = 0; }
      const pct = soc / sh.cap * 100; if (pct < socMinPct) socMinPct = pct;
    } else {
      let pc = null;
      for (let k = Math.max(0, d); k <= Math.min(N - 1, d + 1); k++) { const x = shifts[k]; if (T >= x.pre - 1e-9 && T < x.st - 1e-9) { pc = x; break; } }
      let on = false;
      if (pc && soc < pc.cap - 1e-6) { if (projPV(T, soc, pc.st, pc.cap) < pc.target - 1e-6) on = true; }
      if (on) {
        // lama genset di langkah ini = waktu minimum agar langkah berikutnya tidak lagi butuh precharge
        const Tn = T + DT, base = soc + pv * DT, g = ch * chEff;
        const ok = t => projPV(Tn, Math.min(cap, base + g * t), pc.st, pc.cap) >= pc.target - 1e-6;
        let t = DT;
        if (ok(0)) t = 0;
        else if (ok(DT)) { let lo = 0, hi = DT; for (let q = 0; q < 40; q++) { const mid = (lo + hi) / 2; if (ok(mid)) hi = mid; else lo = mid; } t = hi; }
        pc.preH += t; soc = base + g * t;
      } else soc += pv * DT;
      if (soc > cap) { if (cnt) pvWaste += Math.min(soc - cap, pv * DT); soc = cap; }
    }
  }
  const genH = new Float64Array(N), preH = new Float64Array(N);
  let totalGen = 0, totalPre = 0, starts = 0, nightsGen = 0;
  for (const s of shifts) { genH[s.k] = s.genH; preH[s.k] = s.preH; totalGen += s.genH; totalPre += s.preH; starts += s.starts; if (s.genH > 0) nightsGen++; }
  return { N, shiftHrs, genH, preH, totalGen, totalPre, starts, nightsGen, lampGapWh, socMinPct, pvAvail, pvWaste,
           lampBat, bypass, chargerNet: ch * chEff, capEnd: capRow[Math.min(N, rows) - 1] / bat0 };
}

/* ---------- Bucket per tahun (jam lampu) ---------- */
function bucketize(sim, projectHours, H) {
  const nB = Math.max(1, Math.ceil(projectHours / H - 1e-9));
  const buckets = [];
  for (let y = 1; y <= nB; y++) buckets.push({ y, lo: (y - 1) * H, hi: Math.min(y * H, projectHours), genPeriod: 0 });
  const sh = sim.shiftHrs;
  for (let k = 0; k < sim.N; k++) {
    const a = k * sh, b = (k + 1) * sh, tot = sim.genH[k] + sim.preH[k];
    if (tot <= 0) continue;
    for (const bk of buckets) {
      const ov = Math.min(b, bk.hi) - Math.max(a, bk.lo);
      if (ov > 0) bk.genPeriod += tot * ov / (b - a);
    }
  }
  let cum = 0;
  for (const bk of buckets) {
    bk.genPeriod = r2(bk.genPeriod);
    cum = r2(cum + bk.genPeriod);
    bk.lampCum = bk.hi;
    bk.genCum = cum;
    bk.lampPeriod = bk.hi - bk.lo;
  }
  return buckets;
}

function tr(lang, key, args) {
  const row = D[key];
  let s = row ? (row[LANGS.indexOf(lang)] || row[0]) : key;
  if (args) s = s.replace(/\{(\w+)\}/g, (m, k) => (args[k] !== undefined ? args[k] : m));
  return s;
}

const HEADERS = ['Model', 'Part No', 'Category', 'Component', 'Unit', 'Selling price', 'Qty', 'Hour basis', 'Replace interval (hours)', 'Watt per part', 'Data status', 'List version', 'Notes', 'Calendar interval (months)'];
/* Judul kolom lama (Indonesia) tetap dikenali saat unggah, supaya file lama masih bisa dibaca. */
const HEADER_ALIAS = { 'kategori': 'Category', 'komponen': 'Component', 'satuan': 'Unit', 'harga jual': 'Selling price', 'jumlah': 'Qty', 'basis jam': 'Hour basis', 'interval ganti (jam)': 'Replace interval (hours)', 'status data': 'Data status', 'versi list': 'List version', 'catatan': 'Notes', 'interval kalender (bulan)': 'Calendar interval (months)',
  'quantity': 'Qty', 'price': 'Selling price', 'category': 'Category', 'description': 'Component' };
const REQUIRED = ['Model', 'Part No', 'Component', 'Selling price', 'Qty', 'Hour basis', 'Replace interval (hours)'];
const norm = s => String(s == null ? '' : s).toLowerCase().replace(/\s+/g, ' ').trim();

function toNum(v) {
  if (typeof v === 'number') return v;
  if (v == null) return NaN;
  let s = String(v).trim().replace(/\s/g, '').replace(/^rp\.?/i, '');
  if (s === '') return NaN;
  if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d+,\d+$/.test(s)) s = s.replace(',', '.');
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, '');
  const n = Number(s);
  return isFinite(n) ? n : NaN;
}

function parsePartsRows(rows, selectedModel, rowOffset) {
  const off = rowOffset || 0;
  const errors = [], warnings = [];
  let hi = -1, oldPrice = false;

/* ---------- Kurva jam genset & jadwal penggantian "mana lebih dulu" ----------
   Tiap part boleh punya batas jam (jam lampu / jam genset) dan batas kalender (bulan).
   Penggantian terjadi di batas yang tercapai lebih dulu; setelah itu kedua penghitung mulai dari nol. */
function genCurve(sim) {
  const sh = sim.shiftHrs, N = sim.N;
  const gcum = [0];
  for (let k = 0; k < N; k++) gcum.push(gcum[k] + sim.genH[k] + sim.preH[k]);
  const maxH = N * sh;
  const genAt = h => { h = Math.max(0, Math.min(h, maxH)); const k = Math.min(N - 1, Math.floor(h / sh)); const f = (h - k * sh) / sh; return gcum[k] + f * (gcum[k + 1] - gcum[k]); };
  const genToLamp = X => { let lo = 0, hi = maxH; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (genAt(mid) >= X - 1e-9) hi = mid; else lo = mid; } return hi; };
  return { genAt, genToLamp, maxH, genEnd: gcum[N], gcum, N, sh };
}
function partEvents(q, curve, H, hoursPerYear) {
  const ev = [];
  const calH = q.calMonths > 0 ? q.calMonths * hoursPerYear / 12 : Infinity;   // jam lampu per bulan kalender = jam per tahun / 12
  let last = 0;
  for (let guard = 0; guard < 100000; guard++) {
    let hH = Infinity;
    if (q.interval > 0) {
      if (q.basis === 'Genset hours') { const tgt = curve.genAt(last) + q.interval; hH = tgt <= curve.genEnd + 1e-9 ? curve.genToLamp(tgt) : Infinity; }
      else hH = last + q.interval;
    }
    const nxt = Math.min(hH, last + calH);
    if (!(nxt > last + 1e-9) || !isFinite(nxt) || r9(nxt) > r9(H)) break;
    ev.push(nxt); last = nxt;
  }
  return ev;
}

/* ---------- Cash out per bucket (harga = harga jual apa adanya) ---------- */
function cashOut(parts, buckets, ctx) {
  const groups = [], gmap = {};
  const nB = buckets.length;
  for (const p of parts) {
    if (!(p.qty > 0)) continue;
    const unit = p.harga;
    const costs = new Array(nB).fill(0), counts = new Array(nB).fill(0);
    let evCounts = null;
    if (p.calMonths > 0 && ctx) {
      evCounts = new Array(nB).fill(0);
      const curve = ctx.curve || (ctx.curve = genCurve(ctx.sim));
      partEvents(p, curve, ctx.p.projectHours, ctx.p.hoursPerYear).forEach(h => {
        const i = buckets.findIndex(b => h > b.lo + 1e-9 && h <= b.hi + 1e-9);
        if (i >= 0) evCounts[i]++;
      });
      for (let i = 0; i < nB; i++) { counts[i] = evCounts[i] * p.qty; costs[i] = counts[i] * unit; }
    } else {
      let prev = 0;
      for (let i = 0; i < nB; i++) {
        const X = p.basis === 'Genset hours' ? buckets[i].genCum : buckets[i].lampCum;
        const c = Math.floor(r9(X / p.interval));
        counts[i] = (c - prev) * p.qty;
        costs[i] = counts[i] * unit;
        prev = c;
      }
    }
    let g = gmap[p.kategori];
    if (!g) { g = gmap[p.kategori] = { kategori: p.kategori, rows: [], sub: new Array(nB).fill(0) }; groups.push(g); }
    g.rows.push({ part: p, unit, costs, counts, evCounts, total: costs.reduce((a, b) => a + b, 0) });
    for (let i = 0; i < nB; i++) g.sub[i] += costs[i];
  }
  const partsTot = new Array(nB).fill(0);
  groups.forEach(g => g.sub.forEach((v, i) => { partsTot[i] += v; }));
  return { groups, partsTot };
}

/* ---------- Hitung semuanya ---------- */
function compute(parts, p) {
  const shiftH = ((p.sStop - p.sStart) + 24) % 24 || 24;
  const nights = Math.ceil(p.projectHours / shiftH - 1e-9);
  const sim = runEngine(Object.assign({}, p, { nights, off: 6, sunrise: 6, sunset: 18, soc0: 100 }));
  const buckets = bucketize(sim, p.projectHours, p.hoursPerYear);
  const co = cashOut(parts, buckets, { sim, p });
  const bbmL = buckets.map(b => b.genPeriod * FUEL_LPH);
  const bbmRp = bbmL.map(l => l * p.fuelPrice);
  const total = buckets.map((b, i) => co.partsTot[i] + bbmRp[i]);
  return { sim, buckets, co, bbmL, bbmRp, total };
}

/* ---------- Deret kumulatif per jam lampu (untuk grafik) ---------- */
function cumulative(parts, res, p, nPts) {
  const sim = res.sim, sh = sim.shiftHrs, N = sim.N, H = p.projectHours;
  const gcum = [0];
  for (let k = 0; k < N; k++) gcum.push(gcum[k] + sim.genH[k] + sim.preH[k]);
  const genAt = h => { h = Math.max(0, Math.min(h, N * sh)); const k = Math.min(N - 1, Math.floor(h / sh)); const f = (h - k * sh) / sh; return gcum[k] + f * (gcum[k + 1] - gcum[k]); };
  const genToLamp = X => { let lo = 0, hi = N * sh; for (let i = 0; i < 50; i++) { const mid = (lo + hi) / 2; if (genAt(mid) >= X - 1e-9) hi = mid; else lo = mid; } return hi; };
  const curveAll = genCurve(sim);
  const events = {};                       // kategori -> [[jamLampu, biaya]]
  const genEnd = genAt(H);
  for (const q of parts) {
    if (!(q.qty > 0) || !(q.interval > 0 || q.calMonths > 0)) continue;
    const arr = events[q.kategori] || (events[q.kategori] = []);
    if (q.calMonths > 0) { partEvents(q, curveAll, H, p.hoursPerYear).forEach(h => arr.push([h, q.qty * q.harga])); continue; }
    const lim = q.basis === 'Genset hours' ? genEnd : H;
    for (let i = 1; r9(i * q.interval) <= r9(lim); i++) {
      const X = i * q.interval;
      arr.push([q.basis === 'Genset hours' ? genToLamp(X) : X, q.qty * q.harga]);
    }
  }
  nPts = nPts || 240;
  const xs = []; for (let i = 0; i <= nPts; i++) xs.push(H * i / nPts);
  const series = [{ name: '__bbm', vals: xs.map(h => genAt(h) * FUEL_LPH * p.fuelPrice) }];
  Object.keys(events).forEach(k => {
    const ev = events[k].slice().sort((a, b) => a[0] - b[0]);
    let j = 0, acc = 0;
    const vals = xs.map(h => { while (j < ev.length && ev[j][0] <= h + 1e-9) { acc += ev[j][1]; j++; } return acc; });
    series.push({ name: k, vals });
  });
  return { xs, series };
}

  hdrRow(S, 4, [t('s_total'), t('s_pct')], sT);
  S.getRow(4).height = 34;
  const grand = res.total.reduce((a, b) => a + b, 0);
  let sr = 5;
  const srcRows = [];
  res.co.groups.forEach((g, gi) => {
    put(S, 'A' + sr, g.kategori, f());
    for (let i = 0; i < nB; i++) put(S, colL(sy(i)) + sr, F(CO + colL(YC(i)) + subRows[gi], g.sub[i]), GRN, RP);
    srcRows.push([sr, g.sub.reduce((a, b) => a + b, 0)]); sr++;
  });
  put(S, 'A' + sr, t('s_bbm'), f());
  for (let i = 0; i < nB; i++) put(S, colL(sy(i)) + sr, F(CO + colL(YC(i)) + bbmR, res.bbmRp[i]), GRN, RP);
  srcRows.push([sr, sumRp]); sr++;
  const firstS = 5, lastS = sr - 1;
  srcRows.forEach(([row, tv]) => {
    put(S, colL(sT) + row, F('SUM(B' + row + ':' + colL(sy(nB - 1)) + row + ')', tv), f(), RP);
    put(S, colL(sP) + row, F('IF($' + colL(sT) + '$' + sr + '=0,0,' + colL(sT) + row + '/$' + colL(sT) + '$' + sr + ')', grand ? tv / grand : 0), f(), '0.0%');
  });
  put(S, 'A' + sr, t('s_tot'), BOLD, null, TOT);
  for (let i = 0; i < nB; i++) put(S, colL(sy(i)) + sr, F('SUM(' + colL(sy(i)) + firstS + ':' + colL(sy(i)) + lastS + ')', res.total[i]), BOLD, RP, TOT);
  put(S, colL(sT) + sr, F('SUM(B' + sr + ':' + colL(sy(nB - 1)) + sr + ')', grand), BOLD, RP, TOT);
  put(S, colL(sP) + sr, F('IF(' + colL(sT) + sr + '=0,0,1)', grand ? 1 : 0), BOLD, '0.0%', TOT);
  const sTot = sr; sr++;
  put(S, 'A' + sr, t('c_cum'), f()); let cu2 = 0;
  for (let i = 0; i < nB; i++) { cu2 += res.total[i]; put(S, colL(sy(i)) + sr, F(i === 0 ? 'B' + sTot : colL(sy(i - 1)) + sr + '+' + colL(sy(i)) + sTot, cu2), f(), RP); }
  sr++;
  put(S, 'A' + sr, t('c_perhr'), f());
  for (let i = 0; i < nB; i++) put(S, colL(sy(i)) + sr, F(colL(sy(i)) + sTot + '/(' + FU + 'C' + (5 + i) + '-' + FU + 'B' + (5 + i) + ')', res.total[i] / res.buckets[i].lampPeriod), f(), RP);
  put(S, colL(sT) + sr, F(colL(sT) + sTot + '/' + AS + 'B21', grand / p.projectHours), f(), RP);
  sr += 2;
  put(S, 'A' + sr, t('s_capex'), f()); put(S, 'B' + sr, F(AS + 'B26', p.capex), GRN, RP); const sCap = sr; sr++;
  put(S, 'A' + sr, t('s_capop'), BOLD, null, TOT); put(S, 'B' + sr, F('B' + sCap + '+' + colL(sT) + sTot, p.capex + grand), BOLD, RP, TOT);
  S.getCell('A' + (sr + 2)).value = t('s_foot', { co: nmC }); S.getCell('A' + (sr + 2)).font = NOTE;
  if (ctx.charts && ctx.charts.length) {
    let rowIdx = sr + 4;
    ctx.charts.forEach(ch => {
      try {
        const id = wb.addImage({ base64: ch.uri, extension: 'png' });
        S.addImage(id, { tl: { col: 0.05, row: rowIdx }, ext: { width: ch.w, height: ch.h } });
        rowIdx += Math.ceil(ch.h / 20) + 1;
      } catch (e) { /* grafik opsional */ }
    });
  }
  S.columns = [{ width: 36 }].concat(res.buckets.map(() => ({ width: 21 }))).concat([{ width: 18 }, { width: 13 }]);
  S.views = [{ state: 'frozen', xSplit: 1, ySplit: 4, showGridLines: false }];
  return wb;
}

/* ---------- Template kosong ---------- */
function buildTemplate(ExcelJS, lang) {
  lang = 'en';   // template selalu Inggris agar judul kolom sama dengan mesin
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet('Parts');
  const thin = { style: 'thin', color: { argb: 'FFBFBFBF' } };
  const border = { top: thin, left: thin, bottom: thin, right: thin };
  HEADERS.forEach((h, i) => {
    const c = ws.getCell(1, i + 1); c.value = h; c.font = { name: 'Arial', size: 10, bold: true, color: { argb: 'FFFFFFFF' } };
    c.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1F4E78' } }; c.border = border;
    c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true };
    c.note = { texts: [{ text: tr(lang, 'tip_' + h) }] };
  });
  ws.getRow(1).height = 32;
  for (let r = 2; r <= 300; r++) for (let c = 1; c <= HEADERS.length; c++) { const cell = ws.getCell(r, c); cell.font = { name: 'Arial', size: 10, color: { argb: 'FF0000FF' } }; cell.border = border; if ([6, 7, 9, 10].includes(c)) cell.numFmt = '#,##0'; }
  const dv = (col, formula) => { for (let r = 2; r <= 300; r++) ws.getCell(col + r).dataValidation = { type: 'list', allowBlank: true, formulae: [formula] }; };
  dv('A', '"GD9-M,GDQ9-M,GD7-H,GD9-H,GD12-H"'); dv('H', '"Lamp hours,Genset hours"'); dv('K', '"Official,Estimate"');
  ws.columns = [{ width: 9 }, { width: 12 }, { width: 20 }, { width: 38 }, { width: 8 }, { width: 13 }, { width: 9 }, { width: 12 }, { width: 14 }, { width: 10 }, { width: 11 }, { width: 16 }, { width: 50 }, { width: 14 }];
  ws.views = [{ state: 'frozen', xSplit: 4, ySplit: 1 }];
  return wb;
}

const api = { GEN_RATED_W, INV_RATED_W, cumulative, SPECS, WEATHER, LANGS, FUEL_LPH, HEADERS, tr, degPerYear, runEngine, bucketize, parsePartsRows, cashOut, compute, buildWorkbook, buildTemplate, toNum, r9 };
if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.GIDA = api;
})(typeof window !== 'undefined' ? window : globalThis);

/* ---------- Grafik (SVG) ---------- */
const PAL=['#38bdf8','#22c55e','#a78bfa','#eab308','#f472b6','#14b8a6','#94a3b8'];
const sumA=a=>a.reduce((x,y)=>x+y,0);
const THEME_PAGE={text:'var(--text)',muted:'var(--muted)',grid:'var(--border)',font:'inherit'};
const THEME_FILE={text:'#1f2937',muted:'#6b7280',grid:'#e5e7eb',font:'Arial, sans-serif'};
const mj=v=>dec(v/1e6,1);
function niceStep(max,n){const raw=max/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
const tx=(x,y,s,o)=>{o=o||{};return '<text x="'+x+'" y="'+y+'" text-anchor="'+(o.a||'middle')+'" style="fill:'+(o.c)+';font-size:'+(o.s||12)+'px;font-weight:'+(o.w||400)+';font-family:'+o.f+'">'+esc(s)+'</text>'};
function axis(th,W,H,m,max,step,ff){ff=ff||(v=>dec(v/1e6,0));
  let s='';
  for(let v=0;v<=max+1e-9;v+=step){const y=m.t+(H-m.t-m.b)*(1-v/max);
    s+='<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+y+'" y2="'+y+'" style="stroke:'+th.grid+'" stroke-width="1"/>'+tx(m.l-8,y+4,ff(v),{a:'end',c:th.muted,s:11,f:th.font})}
  return s;
}
function catList(L){const res=L.res;return [{name:T('c_bbm'),col:'#f97316',key:'__bbm'}].concat(res.co.groups.filter(g=>sumA(g.sub)>0).map((g,i)=>({name:g.kategori,col:PAL[i%PAL.length],key:g.kategori})))}
function chartStack(L,th){
  const {res}=L,nB=res.buckets.length,W=460,H=330,m={l:40,r:10,t:62,b:46};
  const cats=catList(L).map(c=>Object.assign({},c,{vals:c.key==='__bbm'?res.bbmRp:res.co.groups.find(g=>g.kategori===c.key).sub}));
  const maxT=Math.max(...res.total,1),step=niceStep(maxT*1.12,5),max=Math.ceil(maxT*1.12/step)*step;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T('g1'))+'">'+axis(th,W,H,m,max,step);
  // legend
  let lx=m.l,ly=14;
  cats.slice().forEach(c=>{const w=20+c.name.length*6.4+14;if(lx+w>W-m.r){lx=m.l;ly+=18}
    s+='<rect x="'+lx+'" y="'+(ly-9)+'" width="11" height="11" rx="2" fill="'+c.col+'"/>'+tx(lx+16,ly+1,c.name,{a:'start',c:th.text,s:11,f:th.font});lx+=w});
  const cw=(W-m.l-m.r)/nB,bw=Math.min(96,cw*0.58),y0=H-m.b,ph=H-m.t-m.b;
  res.buckets.forEach((b,i)=>{
    const x=m.l+i*cw+(cw-bw)/2;let acc=0;
    cats.forEach(c=>{const v=c.vals[i];if(!(v>0))return;const h=v/max*ph,y=y0-(acc+v)/max*ph;
      s+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,0.5)+'" fill="'+c.col+'"/>';
      if(h>=15)s+=tx(x+bw/2,y+h/2+4,mj(v),{c:'#0b1220',s:11,f:th.font});acc+=v});
    const ty=y0-res.total[i]/max*ph;
    s+=tx(x+bw/2,ty-7,mj(res.total[i]),{c:th.text,s:13,w:700,f:th.font});
    s+=tx(x+bw/2,y0+17,T('y_label',{y:b.y}),{c:th.text,s:12,w:600,f:th.font})+tx(x+bw/2,y0+32,T('t_hrs1',{b:nf(b.hi)}),{c:th.muted,s:10.5,f:th.font});
  });
  return s+'</svg>';
}
function chartHours(L,th){
  const {res}=L,nB=res.buckets.length,W=940,m={l:84,r:230,t:40,b:8},rh=46,H=m.t+nB*rh+m.b,bw=W-m.l-m.r;
  const maxV=Math.max(...res.buckets.map(b=>b.lampPeriod),1);
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T('g2'))+'">';
  let lx=m.l;[['#94a3b8',T('g_lamp')],['#f97316',T('g_gen')]].forEach(([c,nm])=>{s+='<rect x="'+lx+'" y="9" width="11" height="11" rx="2" fill="'+c+'"/>'+tx(lx+16,19,nm,{a:'start',c:th.text,s:11,f:th.font});lx+=nm.length*7+40});
  res.buckets.forEach((b,i)=>{
    const y=m.t+i*rh,wl=b.lampPeriod/maxV*bw,wg=b.genPeriod/maxV*bw,pct=b.genPeriod/b.lampPeriod*100;
    s+=tx(m.l-12,y+19,T('y_label',{y:b.y}),{a:'end',c:th.text,s:12,w:600,f:th.font});
    s+='<rect x="'+m.l+'" y="'+(y+4)+'" width="'+wl+'" height="22" rx="3" fill="#94a3b8" opacity=".55"/>';
    s+='<rect x="'+m.l+'" y="'+(y+4)+'" width="'+Math.max(wg,2)+'" height="22" rx="3" fill="#f97316"/>';
    s+=tx(m.l+wl+10,y+16,nf(b.genPeriod)+' / '+nf(b.lampPeriod)+' '+T('g_hrs'),{a:'start',c:th.text,s:12,w:600,f:th.font});
    s+=tx(m.l+wl+10,y+31,T('g_pct',{n:dec(pct,1)}),{a:'start',c:'#f97316',s:10.5,f:th.font});
  });
  return s+'</svg>';
}
function chartShare(L,th,cap){
  const {res,p}=L,W=460,m={l:118,r:96,t:46,b:10},rh=38;
  const cats=catList(L).map(c=>Object.assign({},c,{v:c.key==='__bbm'?sumA(res.bbmRp):sumA(res.co.groups.find(g=>g.kategori===c.key).sub)})).filter(c=>c.v>0).sort((a,b)=>b.v-a.v);
  const Top=sumA(res.total);
  if(cap)cats.unshift({key:'__capex',name:T('g_capex'),col:'#64748b',v:p.capex});
  const Tt=Top+(cap?p.capex:0),H=m.t+cats.length*rh+m.b,bw=W-m.l-m.r,mx=cats[0].v;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(cap?'g7':'g6'))+'">';
  s+=tx(8,18,T('g_total')+' Rp '+mj(Tt)+' '+T('k_mil'),{a:'start',c:th.text,s:15,w:700,f:th.font});
  s+=tx(8,35,cap?(T('g_capex')+' '+dec(p.capex/Tt*100,0)+'% · '+T('g_opx')+' '+dec(Top/Tt*100,0)+'%'):(nf(p.projectHours)+' '+T('b_lamp')+' · Rp '+nf(Tt/p.projectHours)+'/'+T('g_hrs')),{a:'start',c:th.muted,s:11,f:th.font});
  cats.forEach((c,i)=>{
    const y=m.t+i*rh,w=c.v/mx*bw;
    s+=tx(m.l-10,y+19,c.name,{a:'end',c:th.text,s:11.5,f:th.font});
    s+='<rect x="'+m.l+'" y="'+(y+5)+'" width="'+Math.max(w,2)+'" height="22" rx="3" fill="'+c.col+'"/>';
    s+=tx(m.l+w+8,y+20,mj(c.v)+' · '+dec(c.v/Tt*100,0)+'%',{a:'start',c:th.text,s:12,w:700,f:th.font});
  });
  return s+'</svg>';
}
function chartCum(L,th,cap){
  const {res,p}=L,cu=L.cum,W=940,H=360,m={l:46,r:178,t:34,b:46};
  let cats=catList(L).map(c=>Object.assign({},c,{vals:(cu.series.find(s=>s.name===c.key)||{vals:cu.xs.map(()=>0)}).vals})).filter(c=>c.vals[c.vals.length-1]>0);
  if(cap)cats.unshift({key:'__capex',name:T('g_capex'),col:'#64748b',vals:cu.xs.map(()=>p.capex)});
  const n=cu.xs.length,tot=cu.xs.map((x,i)=>cats.reduce((a,c)=>a+c.vals[i],0));
  const maxT=tot[n-1]*1.04,step=niceStep(maxT,8),max=Math.ceil(maxT/step)*step,y0=H-m.b,ph=H-m.t-m.b,pw=W-m.l-m.r,X=h=>m.l+pw*h/p.projectHours,Y=v=>y0-v/max*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T(cap?'g7':'g4'))+'">'+axis(th,W,H,m,max,step);
  // batas tahun
  res.buckets.forEach(b=>{const x=X(b.hi);s+='<line x1="'+x+'" x2="'+x+'" y1="'+m.t+'" y2="'+y0+'" style="stroke:'+th.muted+'" stroke-width="1" stroke-dasharray="3 4" opacity=".6"/>'+tx(x,y0+17,T('y_label',{y:b.y}),{c:th.text,s:12,w:600,f:th.font})+tx(x,y0+32,nf(b.hi),{c:th.muted,s:10.5,f:th.font})});
  s+=tx(m.l,y0+17,'0',{a:'middle',c:th.muted,s:10.5,f:th.font});
  // lapisan bertumpuk
  const lower=new Array(n).fill(0);
  cats.forEach(c=>{
    let top='',bot='';
    for(let i=0;i<n;i++){const up=lower[i]+c.vals[i];top+=(i?'L':'M')+X(cu.xs[i]).toFixed(1)+' '+Y(up).toFixed(1)}
    for(let i=n-1;i>=0;i--)bot+='L'+X(cu.xs[i]).toFixed(1)+' '+Y(lower[i]).toFixed(1);
    s+='<path d="'+top+bot+'Z" fill="'+c.col+'" opacity=".92"/>';
    for(let i=0;i<n;i++)lower[i]+=c.vals[i];
  });
  // label di ujung kanan: nama, nilai, persen (tanpa tumpang tindih)
  const T_=tot[n-1];let acc=0;const lab=cats.map(c=>{const v=c.vals[n-1],mid=Y(acc+v/2);acc+=v;return {c,v,y:mid}});
  for(let k=lab.length-2;k>=0;k--){if(lab[k].y-lab[k+1].y<15)lab[k].y=lab[k+1].y+15}  // dari atas ke bawah
  lab.forEach(o=>{const x=W-m.r+10;s+='<rect x="'+x+'" y="'+(o.y-6)+'" width="9" height="9" rx="2" fill="'+o.c.col+'"/>'+tx(x+14,o.y+3,o.c.name+' · '+mj(o.v)+' ('+dec(o.v/T_*100,0)+'%)',{a:'start',c:th.text,s:11,f:th.font})});
  s+=tx(X(p.projectHours)-4,Y(T_)-8,T('g_total')+' '+mj(T_),{a:'end',c:th.text,s:13,w:700,f:th.font});
  return s+'</svg>';
}
function smoothPath(pts){
  const n=pts.length;if(n<2)return '';
  const dx=[],dy=[],mm=[];for(let i=0;i<n-1;i++){dx.push(pts[i+1][0]-pts[i][0]);dy.push(pts[i+1][1]-pts[i][1]);mm.push(dy[i]/dx[i])}
  const t=[mm[0]];for(let i=1;i<n-1;i++)t.push(mm[i-1]*mm[i]<=0?0:(mm[i-1]+mm[i])/2);t.push(mm[n-2]);
  for(let i=0;i<n-1;i++){if(mm[i]===0){t[i]=0;t[i+1]=0}else{const a=t[i]/mm[i],b=t[i+1]/mm[i],q=a*a+b*b;if(q>9){const k=3/Math.sqrt(q);t[i]=k*a*mm[i];t[i+1]=k*b*mm[i]}}}
  let d='M'+pts[0][0].toFixed(1)+' '+pts[0][1].toFixed(1);
  for(let i=0;i<n-1;i++){const h=dx[i]/3;d+=' C'+(pts[i][0]+h).toFixed(1)+' '+(pts[i][1]+t[i]*h).toFixed(1)+','+(pts[i+1][0]-h).toFixed(1)+' '+(pts[i+1][1]-t[i+1]*h).toFixed(1)+','+pts[i+1][0].toFixed(1)+' '+pts[i+1][1].toFixed(1)}
  return d;
}
function chartCph(L,th){
  const {res}=L,nB=res.buckets.length,W=460,H=330,m={l:52,r:14,t:52,b:46};
  let cumC=0,cumH=0;
  const per=res.buckets.map((b,i)=>res.total[i]/b.lampPeriod),cum=res.buckets.map((b,i)=>{cumC+=res.total[i];cumH+=b.lampPeriod;return cumC/cumH}),bb=res.buckets.map((b,i)=>res.bbmRp[i]/b.lampPeriod);
  const maxV=Math.max(...per,...cum,...bb,1),step=niceStep(maxV*1.15,5),max=Math.ceil(maxV*1.15/step)*step,y0=H-m.b,ph=H-m.t-m.b,pw=W-m.l-m.r;
  const X=i=>m.l+pw*(nB===1?0.5:0.1+0.8*i/(nB-1)),Y=v=>y0-v/max*ph;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T('g5'))+'">'+axis(th,W,H,m,max,step,v=>nf(v));
  const defs=[[per,'#f97316',T('g_cph_y'),1,0],[cum,'#38bdf8',T('g_cph_c'),1,0],[bb,th.muted,T('g_cph_b'),1,1]];
  let lx=m.l;defs.forEach(([v,c,nm,w,dash])=>{s+='<line x1="'+lx+'" x2="'+(lx+16)+'" y1="10" y2="10" style="stroke:'+c+'" stroke-width="2.4"'+(dash?' stroke-dasharray="4 3"':'')+'/>'+tx(lx+21,14,nm,{a:'start',c:th.text,s:10.5,f:th.font});lx+=nm.length*6.2+38});
  res.buckets.forEach((b,i)=>{s+=tx(X(i),y0+17,T('y_label',{y:b.y}),{c:th.text,s:12,w:600,f:th.font})+tx(X(i),y0+32,T('t_hrs1',{b:nf(b.hi)}),{c:th.muted,s:10.5,f:th.font})});
  defs.slice().reverse().forEach(([v,c,nm,w,dash])=>{
    const pts=v.map((y,i)=>[X(i),Y(y)]);
    s+='<path d="'+(nB>1?smoothPath(pts):'')+'" fill="none" style="stroke:'+c+'" stroke-width="2.6" stroke-linecap="round"'+(dash?' stroke-dasharray="5 4"':'')+'/>';
    pts.forEach(pt=>{s+='<circle cx="'+pt[0]+'" cy="'+pt[1]+'" r="4" style="fill:'+c+'"/>'});
  });
  per.forEach((v,i)=>{s+=tx(X(i),Y(v)-10,nf(v),{c:'#f97316',s:12,w:700,f:th.font})});
  cum.forEach((v,i)=>{if(Math.abs(Y(v)-Y(per[i]))>20)s+=tx(X(i),Y(v)+(v<per[i]?19:-10),nf(v),{c:'#38bdf8',s:11,w:600,f:th.font})});
  return s+'</svg>';
}
function chartWx(L,th){
  const wx=L.wx,W=460,H=330,m={l:40,r:10,t:44,b:48},n=wx.length;
  const maxT=Math.max(...wx.map(w=>w.total),1),step=niceStep(maxT*1.12,5),max=Math.ceil(maxT*1.12/step)*step;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(T('g3'))+'">'+axis(th,W,H,m,max,step);
  let lx=m.l;[['#f97316',T('c_bbm')],['#38bdf8',T('g_parts')]].forEach(([c,nm])=>{s+='<rect x="'+lx+'" y="5" width="11" height="11" rx="2" fill="'+c+'"/>'+tx(lx+16,15,nm,{a:'start',c:th.text,s:11,f:th.font});lx+=70});
  const cw=(W-m.l-m.r)/n,bw=Math.min(84,cw*0.6),y0=H-m.b,ph=H-m.t-m.b;
  wx.forEach((w,i)=>{
    const x=m.l+i*cw+(cw-bw)/2,hb=w.bbm/max*ph,hp=w.parts/max*ph;
    s+='<rect x="'+x+'" y="'+(y0-hb)+'" width="'+bw+'" height="'+Math.max(hb,0.5)+'" fill="#f97316"/>';
    s+='<rect x="'+x+'" y="'+(y0-hb-hp)+'" width="'+bw+'" height="'+Math.max(hp,0.5)+'" fill="#38bdf8"/>';
    if(hb>=15)s+=tx(x+bw/2,y0-hb/2+4,mj(w.bbm),{c:'#0b1220',s:11,f:th.font});
    if(hp>=15)s+=tx(x+bw/2,y0-hb-hp/2+4,mj(w.parts),{c:'#0b1220',s:11,f:th.font});
    if(w.sel)s+='<rect x="'+(x-3)+'" y="'+(y0-hb-hp-3)+'" width="'+(bw+6)+'" height="'+(hb+hp+3)+'" fill="none" style="stroke:'+th.text+'" stroke-width="1.6" stroke-dasharray="4 3"/>';
    s+=tx(x+bw/2,y0-hb-hp-8,mj(w.total),{c:th.text,s:13,w:700,f:th.font});
    s+=tx(x+bw/2,y0+17,w.label,{c:th.text,s:11.5,w:w.sel?700:500,f:th.font})+tx(x+bw/2,y0+32,'PSH '+dec(w.psh,1)+(w.sel?' · '+T('g_sel'):''),{c:th.muted,s:10,f:th.font});
  });
  return s+'</svg>';
}
function renderCharts(){
  if(!LAST||!LAST.wx)return;
  const L=LAST,P=THEME_PAGE;
  $('ch1').innerHTML='<h3>'+esc(T('g1'))+'</h3>'+chartStack(L,P);
  $('ch6').innerHTML='<h3>'+esc(T('g6'))+'</h3>'+chartShare(L,P);
  $('ch7').innerHTML='<h3>'+esc(T('g7'))+'</h3>'+chartShare(L,P,true);
  $('ch5').innerHTML='<h3>'+esc(T('g5'))+'</h3>'+chartCph(L,P);
  $('ch4').innerHTML='<h3>'+esc(T('g4'))+'</h3>'+chartCum(L,P);
  $('ch3').innerHTML='<h3>'+esc(T('g3'))+'</h3>'+chartWx(L,P);
  $('ch2').innerHTML='<h3>'+esc(T('g2'))+'</h3>'+chartHours(L,P);
}
function computeWx(L){
  const {p,parts}=L;
  L.cum=GIDA.cumulative(parts,L.res,p);
  L.wx=GIDA.WEATHER.map(w=>{
    const sel=w.id===$('weather').value;
    const r=sel?L.res:GIDA.compute(parts,Object.assign({},p,{psh:w.psh}));
    return {id:w.id,psh:w.psh,sel,label:T('w_'+w.id).split(' (')[0].split(' / ')[0],total:sumA(r.total),bbm:sumA(r.bbmRp),parts:sumA(r.co.partsTot)};
  });
}
function svgToPng(svg,w,h){
  return new Promise((res,rej)=>{
    const src=svg.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" ');
    const img=new Image();
    img.onload=()=>{const c=document.createElement('canvas');c.width=w*2;c.height=h*2;const g=c.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,c.width,c.height);g.drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};
    img.onerror=()=>rej(new Error('svg'));
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(src);
  });
}
async function exportCharts(){
  const L=LAST,F=THEME_FILE,out=[];
  for(const svg of [chartStack(L,F),chartShare(L,F),chartCph(L,F),chartWx(L,F),chartCum(L,F),chartShare(L,F,true),chartHours(L,F)]){
    const mm=svg.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/),w=Math.round(+mm[1]),h=Math.round(+mm[2]);
    try{out.push({uri:await svgToPng(svg,w,h),w:Math.round(w*0.95),h:Math.round(h*0.95)})}catch(e){}
  }
  return out;
}
